const $=id=>document.getElementById(id), delay=ms=>new Promise(r=>setTimeout(r,ms));

function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}function save(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch{}}
if(location.hostname==='appassets.androidplatform.net'){const embedded=document.querySelector('.logo img');if(embedded&&embedded.getAttribute('src')?.startsWith('data:image/jpeg;base64,'))save('penalty-local-logo',embedded.getAttribute('src'));const localLogo=load('penalty-local-logo','');if(/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(localLogo)){let img=document.createElement('img');img.alt='벌칙 랜덤게임';img.src=localLogo;document.querySelector('.logo').replaceChildren(img);}}
const settings=load('lucky-settings',{});let names=Array.isArray(settings.names)?settings.names.slice(0,10).map(String):Array.from({length:5},(_,i)=>`참가자 ${i+1}`);if(names.length<2)names=['참가자 1','참가자 2'];let k=Math.max(1,Math.min(3,names.length-1,Number(settings.k)||1));let history=load('lucky-history',[]);if(!Array.isArray(history))history=[];
let current='wheel',phase='ready',round=1,run=0,chosen=[],revealed=new Set(),ladderData=null,slotData=null,angle=0,busy=false,bombHolder=0,lottoFrame=0,lottoBalls=[],lottoActive=false; var pirateState=null,chamberState=null,mineState=null,bombState=null,horseState=null;
const ids=()=>names.map((_,i)=>i), name=i=>names[i].trim()||`참가자 ${i+1}`, short=i=>Array.from(name(i)).length>8?Array.from(name(i)).slice(0,7).join('')+'…':name(i), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function randomInt(n){if(!Number.isSafeInteger(n)||n<1||n>4294967296)throw Error('invalid range');const cap=4294967296-4294967296%n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=cap);return a[0]%n}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function store(){save('lucky-settings',{names,k})}
function status(s){$('status').textContent=s}function game(){return games.find(g=>g.id===current)}function setAction(label,disabled=false,resetLabel='새로 시작',resetDisabled=false){$('start').textContent=label;$('start').disabled=disabled;$('reset').textContent=resetLabel;$('reset').disabled=resetDisabled}
function lock(){const freeze=phase!=='ready';$('sutdaOpen').disabled=busy||phase==='playing';$('minus').disabled=freeze||names.length<=2;$('plus').disabled=freeze||names.length>=10;document.querySelectorAll('#names input,#penalties button').forEach(b=>b.disabled=freeze);document.querySelectorAll('#games button').forEach(b=>b.disabled=busy);if(!globalThis.crypto?.getRandomValues)$('start').disabled=true;}
function config(){ $('count').textContent=names.length+'명';$('names').innerHTML=names.map((n,i)=>`<label class="name-row"><span>${i+1}</span><input maxlength="16" aria-label="참가자 ${i+1} 이름" data-i="${i}" value="${esc(n)}" placeholder="참가자 ${i+1}"></label>`).join('');$('names').querySelectorAll('input').forEach(x=>x.oninput=()=>{names[+x.dataset.i]=x.value;store();if(current==='ladder')ladderData=makeLadder();preview()});$('penalties').innerHTML=Array.from({length:Math.min(3,names.length-1)},(_,i)=>`<button class="${k===i+1?'active':''}" data-k="${i+1}">${i+1}명</button>`).join('');$('penalties').querySelectorAll('button').forEach(x=>x.onclick=()=>{k=+x.dataset.k;store();config();if(current==='ladder')ladderData=makeLadder();preview()});lock()}

function finish(){stopBombClock();phase='done';busy=false;stopLotto();status('추첨 완료 · 새로 시작하면 모든 참가자가 다시 참여합니다.');setAction('추첨 완료',true,current==='wheel'?'새로 돌리기':'새로 시작');$('result').className='result show';$('result').innerHTML=`<h3>이번 라운드 벌칙자 · ${chosen.length}명</h3><strong>${chosen.map(i=>esc(name(i))).join(' · ')}</strong><small>참가자 ${names.length}명 중 중복 없이 추첨</small>`;history.unshift({game:game().title,names:chosen.map(i=>name(i)),at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});history=history.slice(0,20);save('lucky-history',history);renderHistory();lock()}

function tokens(arr){return arr.map(i=>`<span class="token"><b style="background:${palette[i]}">${i+1}</b>${esc(short(i))}</span>`).join('')}
function wheel(){let active=ids().filter(i=>!chosen.includes(i)),n=active.length,step=2*Math.PI/n,parts='';for(let j=0;j<n;j++){let i=active[j],a=-Math.PI/2+(j-.5)*step,b=a+step,m=a+step/2,x=150+96*Math.cos(m),y=150+96*Math.sin(m);parts+=`<path d="M150 150 L${150+144*Math.cos(a)} ${150+144*Math.sin(a)} A144 144 0 ${step>Math.PI?1:0} 1 ${150+144*Math.cos(b)} ${150+144*Math.sin(b)} Z" fill="${palette[i]}" stroke="#27213c" stroke-width="2"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${n>7?10:13}" font-weight="900" fill="#24213e">${esc(short(i))}</text>`}$('arena').innerHTML=`<div class="wheel-area"><div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" viewBox="0 0 300 300">${parts}</svg><div class="hub">✦</div></div><div class="picked-list">${tokens(chosen)}</div></div>`;angle=0;return active}
async function spin(){begin();setBusy(true);setAction('회전 중…',true,'새로 돌리기',true);let active=wheel(),j=randomInt(active.length),i=active[j],step=360/active.length,offset=(randomInt(1001)/1000-.5)*step*.55;angle=360*(8+randomInt(3))+(360-j*step+offset)%360;status(`${chosen.length+1}번째 벌칙자 추첨 중…`);await delay(60);$('wheel').style.transform=`rotate(${angle}deg)`;await delay(7950);chosen.push(i);$('arena').querySelector('.picked-list').innerHTML=tokens(chosen);setBusy(false);if(chosen.length===k){finish();return}status(`${name(i)} 당첨! 계속 돌리면 남은 참가자만 추첨합니다.`);setAction('계속 돌리기',false,'새로 돌리기');}

function makeLadder(){const order=shuffle(ids()),arr=ids(),rungs=[];for(let j=0;j<arr.length;j++){let p=arr.indexOf(order[j]);while(p>j){rungs.push(p-1);[arr[p-1],arr[p]]=[arr[p],arr[p-1]];p--}}for(let j=0;j<Math.max(3,names.length-1);j++){let at=randomInt(rungs.length+1),p=randomInt(names.length-1);rungs.splice(at,0,p,p)}return{order,rungs,badSlots:shuffle(ids()).slice(0,k)}}

function mixLotto(){lottoActive=true;for(const b of lottoBalls){let a=randomInt(6284)/1000;b.vx=Math.cos(a)*4.8;b.vy=Math.sin(a)*4.8}let last=performance.now();function frame(now){if(!lottoActive)return;let dt=Math.min(2,(now-last)/16.67);last=now;for(let b of lottoBalls){b.vy-=.024*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;let dx=b.x-165,dy=b.y-130,d=Math.hypot(dx,dy);if(d>97){let nx=dx/d,ny=dy/d,dp=b.vx*nx+b.vy*ny;b.x=165+97*nx;b.y=130+97*ny;if(dp>0){b.vx-=2*dp*nx;b.vy-=2*dp*ny}}let speed=Math.hypot(b.vx,b.vy)||1;b.vx*=4.9/speed;b.vy*=4.9/speed}for(let a=0;a<lottoBalls.length;a++)for(let j=a+1;j<lottoBalls.length;j++){let p=lottoBalls[a],q=lottoBalls[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d>0&&d<30){let nx=dx/d,ny=dy/d,push=(30-d)/2;p.x-=nx*push;p.y-=ny*push;q.x+=nx*push;q.y+=ny*push;let v=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny;if(v>0){p.vx-=v*nx;p.vy-=v*ny;q.vx+=v*nx;q.vy+=v*ny}}}for(let b of lottoBalls){let el=$('ball'+b.i);if(el)el.setAttribute('transform',`translate(${b.x} ${b.y})`)}lottoFrame=requestAnimationFrame(frame)}lottoFrame=requestAnimationFrame(frame)}
function animateExit(b){let el=$('ball'+b.i);$('exit').append(el);let points=[[b.x,b.y],[260,117],[305,117],[318,132],[318,204],[336,222],[421,222]],lens=[0];for(let j=1;j<points.length;j++)lens.push(lens[j-1]+Math.hypot(points[j][0]-points[j-1][0],points[j][1]-points[j-1][1]));return new Promise(resolve=>{let t0=performance.now();function f(t){let p=Math.min(1,(t-t0)/1450),d=p*lens.at(-1),j=1;while(j<lens.length-1&&d>lens[j])j++;let r=(d-lens[j-1])/(lens[j]-lens[j-1]||1),a=points[j-1],c=points[j];el.setAttribute('transform',`translate(${a[0]+(c[0]-a[0])*r} ${a[1]+(c[1]-a[1])*r})`);if(p<1)requestAnimationFrame(f);else resolve()}requestAnimationFrame(f)})}
async function drawLotto(){begin();setBusy(true);setAction('혼합 중…',true,'새로 시작',true);lottoInit();mixLotto();status(`${chosen.length+1}번째 공 혼합 중…`);await delay(3400);let b=lottoBalls[randomInt(lottoBalls.length)];lottoBalls=lottoBalls.filter(x=>x!==b);status('공 1개가 배출됩니다…');await animateExit(b);stopLotto();chosen.push(b.i);$('arena').querySelector('.lotto-tray').innerHTML=tokens(chosen);setBusy(false);if(chosen.length===k){finish();return}status(`${b.i+1}번 · ${name(b.i)} 당첨`);setAction('계속 추첨',false,'새로 시작')}

function slotView(){let n=names.length,d=slotData,active=phase==='playing'&&!busy;let mark={pirate:'⚔',chamber:'?',mine:'▦',capsule:'<span class="capsule"></span>'}[current];let deco=current==='pirate'?'<div class="barrel" id="barrel">🏴‍☠️</div>':current==='chamber'?'<div class="turn" style="font-size:13px;color:#a4adcf">운명의 회전판 · 숨은 벌칙 칸</div>':'';$('arena').innerHTML=`<div class="slot-game">${deco}<div class="turn">${d&&d.turn<n?esc(name(d.turn))+' 차례':phase==='ready'?'게임 시작 후 차례대로 선택':'선택 완료'}</div><div class="slots" style="--cols:${Math.min(n,5)}">${ids().map(i=>{let u=d?.used[i],used=u!==undefined;return `<button class="slot ${current} ${used?'used '+(u.bad?'bad':'safe'):''}" style="--slot-color:${palette[i]}" data-i="${i}" ${!active||used?'disabled':''}>${used?(u.bad?(current==='mine'?'💥':'✕'):'✓'):mark}<small>${used?esc(short(u.player)):`${i+1}번`}</small></button>`}).join('')}</div><div class="players" style="margin-top:14px">${ids().map(i=>`<span class="player ${chosen.includes(i)?'out':d?.turn===i?'holder':''}">${esc(short(i))}</span>`).join('')}</div></div>`;$('arena').querySelectorAll('button').forEach(b=>b.onclick=()=>pickSlot(+b.dataset.i))}

let bombClock=0,bombTick=0,bombAudio=null;

function unlockBombAudio(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!bombAudio)bombAudio=new A();if(bombAudio.state==='suspended')bombAudio.resume().catch(()=>{})}catch(e){}}
function bombTone(freq,duration,vol,type='sine',end=freq){try{if(!bombAudio||bombAudio.state!=='running')return;const c=bombAudio,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+duration);g.gain.setValueAtTime(Math.max(.001,vol),t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}

function bombSync(exploded=false){ids().forEach(i=>partyMark(i,chosen.includes(i)?'penalty':i===bombHolder&&phase!=='done'?'current':'waiting'));const p=partyPos(bombHolder),t=$('bombToken');if(!t)return;t.style.setProperty('--x',p.x+'%');t.style.setProperty('--y',p.y+'%');if(exploded)t.textContent='💥';else if(!t.querySelector('svg'))t.innerHTML=bombArt();t.classList.toggle('live',!!bombState&&!exploded);t.classList.toggle('exploded',exploded);$('bombCenter').disabled=busy;$('bombLabel').textContent=phase==='done'?'다시 게임하기':!bombState?(phase==='ready'?'폭탄 돌리기 시작':'다음 폭탄 시작'):'폭탄 넘기기';$('bombSub').textContent=phase==='done'?'이번 게임 종료':exploded?name(bombHolder)+' 벌칙!':phase==='ready'?name(bombHolder)+'부터 시작':name(bombHolder)+' 차례'}

function armBombClock(state){const fire=()=>{if(current!=='bomb'||phase!=='playing'||bombState!==state)return;const remaining=state.deadline-performance.now();if(remaining>0){bombClock=setTimeout(fire,Math.ceil(remaining));return}explodeBomb(state)};bombClock=setTimeout(fire,Math.ceil(Math.max(0,state.deadline-performance.now())));bombTick=setInterval(()=>{if(current==='bomb'&&bombState===state&&phase==='playing'){if(performance.now()>=state.deadline)explodeBomb(state);else bombTone(510,.07,.055,'triangle',390)}},430)}

function raceLane(i){return horseState?.lanes?.[i]??i}
function raceGeometry(lane){const n=names.length;return{rx:370-(lane+.5)*174/n,ry:205-(lane+.5)*126/n}}
function raceArc(lane){const g=raceGeometry(lane),samples=256,a0=Math.PI/2;let lengths=[0],prev=[g.rx*Math.cos(a0),g.ry*Math.sin(a0)];for(let j=1;j<=samples;j++){const a=a0+j*2*Math.PI/samples,p=[g.rx*Math.cos(a),g.ry*Math.sin(a)];lengths.push(lengths[j-1]+Math.hypot(p[0]-prev[0],p[1]-prev[1]));prev=p}return{...g,lengths,total:lengths[samples],samples}}

const validUrl=s=>inApp&&s===updateURL?updateURL:null;
function newer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false}
let updateTimer=0, retired=false;function applyCached(){if(retired)return false;let c=load(cacheKey,null);if(!c||c.url!==load(urlKey,'')||!newer(c.version,appVersion)||!window.luckyCanUpdate())return false;retired=true;clearInterval(updateTimer);document.open();document.write(c.html);document.close();return true}
async function fetchGameUpdate(url){const sources=[url,'https://raw.githubusercontent.com/smssimson/PenaltyGame/main/index.html'];let last;for(const source of sources){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(source,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);let html=await r.text();if(html.length>1500000||!html.includes('function checkUpdate(')||!html.includes('id="arena"'))throw Error('invalid');let doc=new DOMParser().parseFromString(html,'text/html'),v=doc.querySelector('meta[name="lucky-draw-version"]')?.content;if(!v||!/^\d+\.\d+\.\d+$/.test(v))throw Error('version');return {html,v}}catch(e){last=e}finally{clearTimeout(timer)}}throw last||Error('update')}
let updating=false;async function checkUpdate(manual=false){let url=validUrl(load(urlKey,''));if(!url||updating||retired)return;updating=true;try{let {html,v}=await fetchGameUpdate(url);if(newer(v,appVersion)){save(cacheKey,{version:v,html,url});if(!applyCached())status('새 버전 다운로드 완료 · 게임 종료 후 자동 적용')}else if(manual)status('현재 최신 버전입니다.')}catch(e){if(manual)status('현재 저장된 버전으로 계속 이용할 수 있습니다. 연결되면 자동 업데이트합니다.')}finally{updating=false}}
$('updateSetup').onclick=()=>{if(!inApp){location.reload();return}if(busy||phase==='playing'){status('게임 종료 후 업데이트를 확인하세요.');return}checkUpdate(true)};
setTimeout(()=>{if(!applyCached()){checkUpdate();updateTimer=setInterval(()=>{if(document.visibilityState==='visible'){if(!applyCached())checkUpdate()}},30000);window.addEventListener('online',()=>checkUpdate());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});}},0);

})();
</script></body></html>
