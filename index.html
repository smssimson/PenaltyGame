 .marble-modes button{min-height:38px;white-space:normal}
 .marble-ranks{grid-column:1/-1;grid-template-columns:1fr 1fr}
 .marble-rank{min-height:31px}
 .sutda-page{padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));gap:6px}
 .sutda-top{gap:4px;flex-wrap:wrap;padding:0}
 .sutda-top h1{font-size:24px;margin:0}
 .sutda-head-actions{flex-wrap:wrap!important;margin-left:auto}
 .sutda-content .sutda-viewport{display:block;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
 .sutda-board{position:relative;left:auto;top:auto;width:100%;height:auto;transform:none;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;gap:8px;overflow:visible}
 .sb-footer{display:block;grid-column:1;font-size:11px}
 .sb-panel h2{white-space:normal;flex-wrap:wrap;gap:3px}
 .sb-special{grid-template-columns:88px 70px minmax(0,1fr);padding:5px}
 .sb-deck-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sb-deck .sutda-card{width:40px;height:62px}
 .sb-grid.five .sb-hand{padding:3px 1px}
 .sb-grid.five .sutda-pair{gap:2px}
 .sb-grid.five .sutda-card{width:24px;height:38px}
}

/* v3.8.6: one consistent user-supplied artwork, without cropping the title. */
.app-splash.same-art-splash .splash-content{width:100%;max-height:100%;padding:10px;gap:clamp(3px,1.2vh,10px)}
.same-art-splash .splash-emblem{width:min(78vw,66vh,512px);border:0;border-radius:8%;box-shadow:0 0 45px #f33b4a55;background:#0a0c16}
.same-art-splash .splash-emblem img{object-fit:contain}
.same-art-splash .splash-title{display:none}
.same-art-splash .splash-content p{font-size:clamp(11px,2.4vw,16px)}
.same-art-splash .splash-kicker{margin-top:2px}
.same-art-splash .splash-progress{margin:4px 0}
.same-art-splash .splash-content button{padding:5px}
header .logo img{object-fit:contain}
@media(orientation:landscape){.same-art-splash .splash-emblem{width:min(65vw,68vh,512px)}}
