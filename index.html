const holes=Array.from({length:20},(_,i)=>({i,...pirateProjection(i,rot)})).filter(p=>p.z>.14).sort((a,b)=>a.z-b.z).map(p=>{const used=state.used[p.i],disabled=phase!=='playing'||busy||used;return `<g data-slot="${p.i}" role="button" tabindex="${disabled?-1:0}" aria-label="${p.i+1}번 칼 구멍" aria-disabled="${!!disabled}" transform="translate(${p.x} ${p.y}) scale(${.47+.53*p.z} 1)"><rect x="-19" y="-24" width="38" height="48" rx="8" fill="transparent"/><rect class="hole-rim" x="-10" y="-20" width="20" height="40" rx="6" fill="#502611" stroke="#cf8845" stroke-width="2.2"/><rect x="-5.5" y="-16" width="11" height="32" rx="3" fill="#130c09"/>${used?`<g transform="rotate(-17)"><path d="M-3 -6 L-3 19 0 23 3 19 3 -6" fill="#c7d5df" stroke="#556275"/><rect x="-11" y="-10" width="22" height="6" rx="2" fill="#e0a23f"/><rect x="-5" y="-29" width="10" height="20" rx="4" fill="${palette[used.player]}"/><circle cy="-29" r="4.5" fill="#f4c15d"/></g>`:''}</g>`}).join('');
const front=c>.02,faceX=210+40*f,faceScale=Math.max(.13,c);const face=front?`<g transform="translate(${faceX} 0) scale(${faceScale} 1) translate(-210 0)"><path d="M153 126 Q200 94 267 127" stroke="#302119" stroke-width="8" fill="none"/><ellipse cx="187" cy="130" rx="12" ry="16" fill="#fff8e8"/><ellipse cx="188" cy="131" rx="6" ry="9" fill="#2b2523"/><circle cx="190" cy="128" r="2.2" fill="#fff"/><path d="M218 114 Q244 109 254 125 L250 139 Q236 151 221 140Z" fill="url(#patch)" stroke="#241d1a" stroke-width="2"/><ellipse cx="209" cy="143" rx="20" ry="15" fill="url(#skin)" stroke="#d99555" stroke-width="1.6"/><path d="M177 153 Q187 151 209 160 Q231 150 244 151 Q237 173 211 172 Q188 171 177 153Z" fill="#37231a"/><path d="M193 163 Q211 169 229 162 Q219 180 210 180 Q200 178 193 163Z" fill="#722e20"/><path d="M195 164 Q210 167 225 163 L222 169 199 169Z" fill="#fff5dc"/></g>`:`<g transform="translate(${210+35*f} 0)"><path d="M-12 96 Q25 83 39 109 Q26 121 5 112 Q30 135 20 145 Q-8 124 -12 96Z" fill="url(#bandana)" stroke="#7c191d" stroke-width="2"/></g>`;
$('pirateSvg').innerHTML=`<defs><linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b1d10"/><stop offset=".16" stop-color="#86451e"/><stop offset=".39" stop-color="#d18a48"/><stop offset=".62" stop-color="#a85b2a"/><stop offset=".87" stop-color="#663315"/><stop offset="1" stop-color="#32190f"/></linearGradient><linearGradient id="woodRim"><stop stop-color="#6c3619"/><stop offset=".48" stop-color="#df9f5c"/><stop offset="1" stop-color="#75421f"/></linearGradient><linearGradient id="band" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#261b19"/><stop offset=".23" stop-color="#79706a"/><stop offset=".5" stop-color="#a39a8c"/><stop offset=".75" stop-color="#66584e"/><stop offset="1" stop-color="#2c201a"/></linearGradient><radialGradient id="skin" cx=".34" cy=".22" r=".9"><stop stop-color="#ffe0a5"/><stop offset=".57" stop-color="#f3b96e"/><stop offset="1" stop-color="#ae6435"/></radialGradient><radialGradient id="bandana" cx=".33" cy=".17" r=".9"><stop stop-color="#ff9b7a"/><stop offset=".32" stop-color="#ed4236"/><stop offset=".76" stop-color="#ad191c"/><stop offset="1" stop-color="#741317"/></radialGradient><linearGradient id="patch"><stop stop-color="#39342d"/><stop offset="1" stop-color="#090d12"/></linearGradient></defs><ellipse cx="210" cy="441" rx="139" ry="19" fill="#090c15" opacity=".56"/><path d="M96 181 Q55 241 74 349 Q81 402 111 425 Q210 461 309 425 Q339 402 346 349 Q365 241 324 181Z" fill="url(#wood)" stroke="#492718" stroke-width="4"/>${slats}<path d="M80 228 Q210 268 340 228 L343 245 Q210 286 77 245Z" fill="url(#band)" stroke="#38261c" stroke-width="2"/><path d="M70 296 Q210 332 350 296 L349 311 Q210 349 71 311Z" fill="url(#band)" stroke="#38261c" stroke-width="2"/><path d="M86 388 Q210 419 334 388 L327 402 Q210 435 93 402Z" fill="url(#band)" stroke="#38261c" stroke-width="2"/><ellipse cx="210" cy="181" rx="116" ry="40" fill="url(#woodRim)" stroke="#492718" stroke-width="4"/><ellipse cx="210" cy="178" rx="90" ry="27" fill="#291b14" st }
function pirateView(pop=false){if(!pirateState)pirateState={rot:0,used:{},trap:randomInt(20),turn:0};const p=pirateCurrentPlayer(),ready=phase==='ready';$('arena').innerHTML=`<div class="pirate-v3"><div class="pirate-art"><svg id="pirateSvg" viewBox="0 0 420 470" aria-label="회전하는 해적 장난감 통"></svg><div class="pirate-arrows"><button id="pirateLeft">◀ 회전</button><button id="pirateRight">회전 ▶</button></div></div><div class="pirate-info"><div class="turn">${ready?'게임 시작':esc(name(p))+' 차례'}</div><p style="color:#cbd4ea;font-size:13px">통을 좌우로 밀어서 돌려보세요. 앞·옆·뒤 전체 20개의 칼 구멍이 이어집니다.</p><div class="players">${ids().map(i=>`<span class="player ${chosen.includes(i)?'out':!ready&&i===p?'holder':''}">${esc(short(i))}</span>`).join('')}</div><div class="slot-grid" style="margin-top:16px">${Array.from({length:20},(_,i)=>`<div class="slot-chip ${pirateState.used[i]?'used':''}">${i+1}</div>`).join('')}</div></div></div>`;pirateDraw(pop);const svg=$('pirateSvg');let drag=null;svg.onpointerdown=e=>{if(busy||phase==='done')return;drag={x:e.clientX,rot:pirateState.rot,slot:e.target.closest('[data-slot]')?.dataset.slot,moved:false};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5)drag.moved=true;if(drag.moved){pirateState.rot=drag.rot+dx*.85;pirateDraw()}};svg.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;if(!d.moved&&d.slot!==undefined)selectPirateSlot(+d.slot)};svg.onpointercancel=()=>{drag=null};svg.onkeydown=e=>{const slot=e.target.closest('[data-slot]')?.dataset.slot;if(slot!==undefined&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectPirateSlot(+slot)}};$('pirateLeft').onclick=()=>{if(!busy&&phase!=='done'){pirateState.rot-=36;pirateDraw()}};$('pirateRight').onclick=()=>{if(!busy&&phase!=='done'){pirateState.rot+=36;pirateDraw()}}}
function startPirate(){begin();pirateState={rot:pirateState?.rot||0,used:{},trap:randomInt(20),turn:20%names.length===0?0:randomInt(names.length)};pirateView();setAction('차례대로 칼 꽂기',true,'새로 시작');status(name(pirateCurrentPlayer())+' 차례')}
async function selectPirateSlot(i){if(busy||phase!=='playing'||!Number.isInteger(i)||i<0||i>=20||pirateState.used[i]||pirateProjection(i,pirateState.rot).z<=.14)return;setBusy(true);$('reset').disabled=true;const p=pirateCurrentPlayer(),bad=i===pirateState.trap;pirateState.used[i]={player:p,bad};pirateView(bad);status(name(p)+(bad?' · 해적 등장!':' · 통과'));await delay(bad?1050:380);setBusy(false);if(bad){chosen.push(p);if(chosen.length===k){finish();pirateView(true);return}pirateState.used={};pirateState.trap=randomInt(20);pirateState.turn=randomInt(alivePlayers().length)}else pirateState.turn++;pirateView();setAction('차례대로 칼 꽂기',true,'새로 시작');status((bad?name(p)+' 벌칙! · 새 통 · ':'')+name(pirateCurrentPlayer())+' 차례')}


function chamberView(){$('arena').innerHTML=`<div class="party-ring"><div class="party-orbit"></div>${partySeats()}<div class="party-gun" id="gunPod"><svg id="gunShape" viewBox="0 0 180 180" aria-label="회전하는 게임용 모형 총"><defs><linearGradient id="toyMetal"><stop stop-color="#344661"/><stop offset=".48" stop-color="#b9cce0"/><stop offset="1" stop-color="#425571"/></linearGradient><linearGradient id="toyGrip"><stop stop-color="#a76337"/><stop offset="1" stop-color="#513321"/></linearGradient></defs><g class="gun-flash" fill="#ffce53"><path d="M90 0 95 12 111 6 104 19 120 23 102 27 108 40 90 33 78 39 80 25 61 20 78 15 76 2Z"/></g><path d="M78 30H102V82H78Z" fill="url(#toyMetal)" stroke="#24304b" stroke-width="3"/><rect x="76" y="20" width="28" height="15" rx="3" fill="#ff9047" stroke="#b24e25" stroke-width="2"/><path d="M67 70 Q90 59 112 70 L115 113 102 122 75 119 63 104Z" fill="url(#toyMetal)" stroke="#28364c" stroke-width="3"/><rect x="70" y="73" width="40" height="31" rx="9" fill="#6a7c97" stroke="#34425a" stroke-width="2"/><path d="M80 77V100 M90 76V102 M100 77V100" stroke="#c1cde0" stroke-width="3" stroke-linecap="round"/><path d="M79 112 Q88 105 100 112 L112 155 Q108 165 94 166 L75 148Z" fill="url(#toyGrip)" stroke="#3b2b23" stroke-width="3"/><path d="M65 109 Q52 126 67 139 Q79 144 83 129" stroke="#a0b0c7" stroke-width="5" fill="none"/><path d="M71 115 L69 127" stroke="#56647b" stroke-width="4" stroke-linecap="round"/></svg></div><div class="gun-note" id="gunNote">시계방향 순차 격발</div></div>`;partyMark(0,'current')}
async function playChamber(){if(phase!=='ready'||busy)return;begin();setBusy(true);setAction('순차 격발 중…',true,'새로 시작',true);chamberView();const targets=new Set(shuffle(ids()).slice(0,k));for(let i=0;i<names.length;i++){partyMark(i,'current');$('gunShape').style.transform='rotate('+i*360/names.length+'deg)';$('gunNote').textContent=name(i)+' 차례';status(name(i)+' · 조준');await delay(800);const hit=targets.has(i);if(hit){chosen.push(i);$('gunPod').classList.add('firing')}partyMark(i,hit?'penalty':'safe');$('gunNote').textContent=hit?'탕! 벌칙':'딸깍 · 통과';status(name(i)+(hit?' · 벌칙':' · 통과'));await delay(hit?1100:650);$('gunPod').classList.remove('firing')}setBusy(false);finish()}

function mineCurrentPlayer(){const alive=alivePlayers();return alive.length?alive[mineState.turn % alive.length]:0}
function mineView(){
  if(!mineState)mineState={bad:new Set(),used:{},turn:0};
  const grid=Array.from({length:25},(_,i)=>{const u=mineState.used[i], used=u!==undefined, cls=['mine-cell',used?(u.bad?'bad':'safe'):''].join(' '); return `<button class="${cls}" data-cell="${i}" ${phase!=='playing'||used||busy?'disabled':''}>${used?(u.bad?'💥':'✓'):''}<small>${used?esc(short(u.player)):(i+1)}</small></button>`}).join('');
  $('arena').innerHTML=`<div class="mine-wrap"><div class="mine-grid">${grid}</div><div class="mine-side"><div class="turnbox"><div style="color:#a4adcf;font-size:12px;font-weight:800">현재 차례</div><b>${phase==='ready'?'게임 대기':esc(name(mineCurrentPlayer()))}</b><div style="margin-top:8px;color:#a4adcf">5x5 격자에서 한 칸을 선택하세요.</div></div><div class="players">${ids().map(i=>`<span class="player ${chosen.includes(i)?'out':phase==='playing'&&i===mineCurrentPlayer()?'holder':''}">${esc(short(i))}</span>`).join('')}</div></div></div>`;
  $('arena').querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>pickMine(+b.dataset.cell));
}
function startMine(){begin();mineState={bad:new Set([randomInt(25)]),used:{},turn:25%names.length===0?0:randomInt(names.length)};mineView();setAction('차례대로 선택',true,'새로 시작');status(name(mineCurrentPlayer())+'부터 차례대로 칸을 선택하세요.');}
async function pickMine(i){
  if(busy||phase!=='playing'||mineState.used[i]!==undefined)return;
  setBusy(true);const p=mineCurrentPlayer(), bad=mineState.bad.has(i);mineState.used[i]={player:p,bad};if(bad&&!chosen.includes(p))chosen.push(p);mineView();status(`${name(p)} · ${bad?'지뢰 폭발!':'안전'}`);await delay(550);setBusy(false);
  if(chosen.length>=k){finish();mineView();return}
  if(bad){mineState.used={};mineState.bad=new Set([randomInt(25)]);mineState.turn=randomInt(alivePlayers().length)}else mineState.turn++;mineView();
}

async function start(){
  if(busy||phase==='done')return;
  try{
    if(current==='wheel')await spin();
    else if(current==='lotto')await drawLotto();
    else if(current==='ladder')await revealLadder(ids());
    else if(current==='cards'){if(phase==='ready')startCards();else ids().forEach(revealCard)}
    else if(current==='bomb')await bomb();
    else if(current==='pirate'){if(phase==='ready')startPirate();}
    else if(current==='chamber')await playChamber();
    else if(current==='mine'){if(phase==='ready')startMine();}
    else if(current==='horse')await race();
  }catch(e){console.error(e);prepare();status('게임 실행에 문제가 생겼습니다. 다시 시도해 주세요.')}
}

$('minus').onclick=()=>{if(phase!=='ready'||names.length<=2)return;names.pop();k=Math.min(k,names.length-1);store();config();if(current==='ladder')ladderData=makeLadder();preview()};$('plus').onclick=()=>{if(phase!=='ready'||names.length>=10)return;names.push(`참가자 ${names.length+1}`);store();config();if(current==='ladder')ladderData=makeLadder();preview()};$('start').onclick=start;$('reset').onclick=()=>{if(busy)return;if(current==='wheel'){prepare(true);start();return}if(phase==='playing'&&!confirm('현재 추첨을 초기화하고 새로 시작할까요?'))return;prepare(true)};$('clear').onclick=()=>{if(confirm('추첨 기록을 삭제할까요?')){history=[];save('lucky-history',history);renderHistory()}};
prepare();renderHistory();
// Native wrapper can safely reload at an idle point without interrupting a draw.
window.luckyCanUpdate=()=>!busy&&phase!=='playing';
// An opt-in update URL must point to the owner's trusted, HTTPS-hosted single-file game.
const appVersion='3.3.0', urlKey='lucky-update-url', cacheKey='lucky-update-cache';
const updateURL='https://smssimson.github.io/PenaltyGame/index.html';const inApp=location.hostname==='appassets.androidplatform.net';if(inApp&&load(urlKey,'')!==updateURL){save(cacheKey,null);save(urlKey,updateURL);}

const validUrl=s=>inApp&&s===updateURL?updateURL:null;
function newer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false}
let updateTimer=0, retired=false;function applyCached(){if(retired)return false;let c=load(cacheKey,null);if(!c||c.url!==load(urlKey,'')||!newer(c.version,appVersion)||!window.luckyCanUpdate())return false;retired=true;clearInterval(updateTimer);document.open();document.write(c.html);document.close();return true}
let updating=false;async function checkUpdate(manual=false){let url=validUrl(load(urlKey,''));if(!url||updating||retired)return;updating=true;try{const r=await fetch(url,{cache:'no-store',credentials:'omit',redirect:'error'});if(!r.ok)throw Error('HTTP '+r.status);let html=await r.text();if(html.length>1500000)throw Error('size');let doc=new DOMParser().parseFromString(html,'text/html'),v=doc.querySelector('meta[name="lucky-draw-version"]')?.content;if(!v||!/^\d+\.\d+\.\d+$/.test(v))throw Error('version');if(newer(v,appVersion)){save(cacheKey,{version:v,html,url});if(!applyCached())status('새 버전 다운로드 완료 · 게임 종료 후 자동 적용')}else if(manual)status('현재 최신 버전입니다.')}catch(e){if(manual)status('업데이트 주소에 연결할 수 없습니다. HTTPS 주소와 CORS 설정을 확인하세요.')}finally{updating=false}}
$('updateSetup').onclick=()=>{if(!inApp){location.reload();return}if(busy||phase==='playing'){status('게임 종료 후 업데이트를 확인하세요.');return}checkUpdate(true)};
setTimeout(()=>{if(!applyCached()){checkUpdate();updateTimer=setInterval(()=>{if(document.visibilityState==='visible'){if(!applyCached())checkUpdate()}},30000);window.addEventListener('online',()=>checkUpdate());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});}},0);

})();
